name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]

    steps:
      - uses: actions/checkout@v7

      # Version comes from the packageManager field in package.json
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      # bash on every OS, so a failure on any line fails the step
      # (PowerShell on Windows would only check the last command)
      - name: Smoke test the built CLI
        shell: bash
        run: |
          node dist/cli.js --version
          node dist/cli.js scan .
          node dist/cli.js --json scan . --limit 3
          node dist/cli.js deps .
          node dist/cli.js --json deps . --limit 3
